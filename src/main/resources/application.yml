server:
  port: ${PORT:8082}
spring:
  application:
    name: support-maintenance-service
  boot:
    admin:
      client:
        url: http://localhost:8085
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/smartgn_support_db}
    username: ${DB_USERNAME:smartgn_support}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
