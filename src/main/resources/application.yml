server:
  port: 8083

spring:
  application:
    name: support-maintenance-service
  boot:
    admin:
      client:
        url: http://localhost:8085
  datasource:
    url: jdbc:postgresql://localhost:5432/smartgn_support_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html